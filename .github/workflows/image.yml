name: Image

# Publishes ghcr.io/<owner>/cc-modern (the app) and ghcr.io/<owner>/cc-modern-session
# (what sessions run) for linux/amd64 and linux/arm64. The session image also comes with
# Codex CLI and Gemini CLI added, under the same tags with -all (e.g. :latest-all).
#   push to main  -> :latest, :main, :<major>.<minor>.<run number> (minor from package.json)
#   tag v1.2.3    -> :1.2.3, :1.2, :1, :latest
#   weekly        -> rebuilt, so the session image picks up the newest stable Claude Code
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push supersedes an in-flight build, so an older image can't land on :latest last.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: cc-modern
            context: .
            description: Claude Code sessions in containers on your own hardware, with web terminals
          - name: cc-modern-session
            context: ./session
            description: The cc·modern session runtime - Claude Code, tmux, git and gh
            agents: claude
          - name: cc-modern-session
            context: ./session
            description: The cc·modern session runtime with Claude Code, Codex CLI and Gemini CLI
            agents: claude codex gemini
            suffix: -all
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every main build gets its own version: package.json's major.minor plus the run number.
      # A v* tag uses the tag's version instead.
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
            echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.description=${{ matrix.description }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CCM_VERSION=${{ steps.ver.outputs.version }}
            AGENTS=${{ matrix.agents }}
          cache-from: type=gha,scope=${{ matrix.name }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}${{ matrix.suffix }}
