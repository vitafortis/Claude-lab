# cc·modern — Claude Code sessions on your own hardware.
#
#   docker compose up -d
#   open http://<this-host>:3050, create your login, then connect Claude and GitHub
#
services:
  cc-modern:
    image: ghcr.io/vitafortis/cc-modern:latest
    container_name: cc-modern
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      # The image each session runs (Claude Code, git, gh, tmux). Pulled on first start;
      # Settings → Pull latest updates it.
      CCM_SESSION_IMAGE: ghcr.io/vitafortis/cc-modern-session:latest
      # Optional: "Sign in with GitHub" through your own OAuth app (device flow enabled).
      # Without it, add personal access tokens under Accounts.
      # CCM_GITHUB_CLIENT_ID: Iv1.0123456789abcdef
      # Optional: create the login here instead of in the setup screen.
      # CCM_ADMIN_EMAIL: you@example.com
      # CCM_ADMIN_PASSWORD: ${CCM_ADMIN_PASSWORD}
      # Optional: manage the credential encryption key yourself.
      # Otherwise a random key is generated at /data/secret.key — back it up.
      # CCM_SECRET_KEY: change-me-to-a-long-random-string
      # Behind a TLS reverse proxy, uncomment so secure cookies work:
      # PROTOCOL_HEADER: x-forwarded-proto
      # HOST_HEADER: x-forwarded-host
    volumes:
      # Accounts and settings (encrypted tokens, the key file).
      - cc-modern-data:/data
      # Session data: each session's repo and home folder, and each Claude account's
      # login and conversations. Session containers mount their part of this volume.
      - cc-modern-sessions:/sessions
      # cc·modern creates, starts and stops the session containers. Anyone who can sign
      # in to cc·modern can run code on this Docker host: keep it on your LAN or a VPN.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  cc-modern-data:
  cc-modern-sessions:
    name: cc-modern-sessions
