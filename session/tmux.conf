# cc·modern draws its own chrome around the terminal, so tmux stays invisible.
set -g status off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g escape-time 0
set -g history-limit 50000
# Several browsers can watch one session; size the window to whoever typed last.
set -g window-size latest
setw -g aggressive-resize on
# Wheel scrolls tmux history; hold Shift to select text in the browser.
set -g mouse on
# Copy (in tmux or Claude Code) reaches the browser clipboard over OSC 52.
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
# Pass terminal hyperlinks (OSC 8) through, so they're clickable in the browser.
set -as terminal-features ",*:hyperlinks"
