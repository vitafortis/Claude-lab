# Build the images from this checkout instead of pulling them:
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Handy for adding tools to the session image (edit session/Dockerfile), for running
# without access to ghcr.io, or for trying a branch before it's published.
services:
  orbital:
    image: orbital:local
    build: .
    environment:
      ORB_SESSION_IMAGE: orbital-session:local
      ORB_AGENTS_IMAGE: orbital-session:local-all
    depends_on:
      session-image:
        condition: service_completed_successfully
      session-image-all:
        condition: service_completed_successfully

  # Build the session images; Orbital starts the actual session containers from them.
  session-image:
    image: orbital-session:local
    build: ./session
    entrypoint: ["true"]
    restart: "no"

  # With Codex CLI and Gemini CLI, for OpenAI and Google accounts. Remove this service
  # (and ORB_AGENTS_IMAGE above) if you only use Claude.
  session-image-all:
    image: orbital-session:local-all
    build:
      context: ./session
      args:
        AGENTS: claude codex gemini
    entrypoint: ["true"]
    restart: "no"
